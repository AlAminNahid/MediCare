version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_container
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_kFihyEVDM7W1@ep-shy-queen-aycmamse.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      JWT_SECRET: your_jwt_secret_change_in_production
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - app_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  app_network:
    driver: bridge
